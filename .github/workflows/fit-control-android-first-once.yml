name: FIT CONTROL synthetic Android first build C070
on:
  push:
    branches: [engineering/fit-control-mvp]
    paths: [.github/workflows/fit-control-android-first-once.yml]
permissions:
  contents: read
jobs:
  android:
    if: github.repository == 'Vutovk31/fitnesslab' && github.ref == 'refs/heads/engineering/fit-control-mvp' && github.event.repository.private == false && github.event.before == '7e3476591b6f423c020f9673d05e5728a44c23e0'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      FIT_CONTROL_SYNTHETIC_BUILD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 7e3476591b6f423c020f9673d05e5728a44c23e0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: BUILD gate - source and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '7e3476591b6f423c020f9673d05e5728a44c23e0'
          test "$(git hash-object docs/fit-control/handoff/source-manifest.tsv)" = 669f7f4b4fe1ccd822d6b8f33e0f213a447e1e71
          count=0
          while IFS=$'\t' read -r sha path; do
            test "$(git hash-object "fit-control/$path")" = "$sha"
            count=$((count+1))
          done < docs/fit-control/handoff/source-manifest.tsv
          test "$count" = 99
          echo 'SOURCE_99_PASS'
          test "$(git hash-object fit-control/mobile/package.json)" = 71635f30339a0f439711ffe2f7e53b7332c8bdea
          echo '7f2abd99210915f487ee70f6b646fae4899cb8843caffea1d99cd3e0d88adfc5  docs/fit-control/handoff/mobile-package-lock.candidate.json' | sha256sum -c -
          test "$(node --version)" = v22.16.0
          test "$(npm --version)" = 10.9.2
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/javac" -version | grep -E '^javac 21([.]|$)'
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          cp docs/fit-control/handoff/mobile-package-lock.candidate.json fit-control/mobile/package-lock.json
          cd fit-control/mobile
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --strict-ssl=true
          echo '7f2abd99210915f487ee70f6b646fae4899cb8843caffea1d99cd3e0d88adfc5  package-lock.json' | sha256sum -c -
      - name: BUILD gate - original license evidence
        working-directory: fit-control/mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, urllib.request, urllib.parse, hashlib
          lock=json.loads(pathlib.Path('package-lock.json').read_text())['packages']
          missing=[]
          for name,p in lock.items():
              if not name: continue
              root=pathlib.Path(name)
              if not (root/'package.json').is_file(): continue
              m=json.loads((root/'package.json').read_text())
              assert m['version']==p['version'], name
              assert m.get('license')==p.get('license'), name
              candidates=[f for f in root.iterdir() if f.is_file() and re.match(r'^(licen[cs]e|copying|notice)([._-]|$)',f.name,re.I)]
              def valid(s):
                  return any(x in s.lower() for x in ('permission is hereby granted','redistribution and use','apache license','blue oak model license','public domain','this software is provided','permission to use, copy','permission to use this software','gnu general public license'))
              found=[(str(f),f.read_bytes()) for f in candidates if valid(f.read_text(errors='replace'))]
              if not found:
                  # Exact npm metadata is tied to locked tarball integrity and upstream gitHead.
                  pkg=m['name']; ver=m['version']
                  url='https://registry.npmjs.org/'+urllib.parse.quote(pkg,safe='')+'/'+ver
                  with urllib.request.urlopen(url,timeout=20) as response: meta=json.load(response)
                  assert meta['dist']['integrity']==p['integrity'], name
                  rev=meta.get('gitHead','')
                  repo=meta.get('repository',{})
                  if isinstance(repo,str): repo={'url':repo}
                  match=re.search(r'github\.com[/:]([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)',repo.get('url',''))
                  if match and re.fullmatch(r'[0-9a-f]{40}',rev):
                      slug=match.group(1).removesuffix('.git')
                      directory=repo.get('directory','').strip('/')
                      for prefix in dict.fromkeys([directory,'']):
                          for filename in ['LICENSE','LICENSE.md','LICENSE.txt','LICENCE','COPYING','UNLICENSE','README.md']:
                              path='/'.join(filter(None,[prefix,filename]))
                              src='https://raw.githubusercontent.com/'+slug+'/'+rev+'/'+path
                              try:
                                  with urllib.request.urlopen(src,timeout=10) as response: data=response.read(262144)
                              except Exception: continue
                              if valid(data.decode('utf-8','replace')):
                                  found=[(src,data)]; break
                          if found: break
              if not found:
                  missing.append(name)
              else:
                  for origin,data in found:
                      print(json.dumps({'package':name,'version':m['version'],'license':m['license'],'source':origin,'sha256':hashlib.sha256(data).hexdigest()}))
          print('LICENSE_UNRESOLVED='+json.dumps(missing))
          if missing: raise SystemExit('BUILD gate failed: unresolved original license evidence')
          print('BUILD_LICENSE_GATE_PASS')
          PY
      - name: BUILD gate - synthetic web and metafile
        working-directory: fit-control/mobile
        shell: bash
        run: |
          set -euo pipefail
          test "$FIT_CONTROL_SYNTHETIC_BUILD" = 1
          npm run build:web
          node --input-type=module <<'JS'
          import {build} from 'esbuild';
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const r=await build({entryPoints:['./native-entry.mjs'],bundle:true,define:{__FIT_CONTROL_PRIVACY_MODE__:JSON.stringify('synthetic')},platform:'browser',format:'esm',target:'es2022',write:false,legalComments:'inline',outfile:'app.js',metafile:true});
          assert.equal(r.outputFiles.length,1);
          assert.deepEqual(Buffer.from(r.outputFiles[0].contents),readFileSync('www/app.js'));
          console.log('ESBUILD_METAFILE='+JSON.stringify(r.metafile));
          JS
          sha256sum www/index.html www/app.js
      - name: Android generation and runtime dependency inventory
        working-directory: fit-control/mobile
        shell: bash
        run: |
          set -euo pipefail
          test ! -e android
          node_modules/.bin/cap add android
          node_modules/.bin/cap sync android
          cd android
          cat gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon --version
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath | tee "$RUNNER_TEMP/runtime-classpath.txt"
          if grep -E ' FAILED|Could not resolve' "$RUNNER_TEMP/runtime-classpath.txt"; then exit 1; fi
          echo 'NATIVE_GRAPH_CAPTURED'
          ./gradlew --no-daemon :app:assembleDebug
      - name: ARTIFACT gate - verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=fit-control/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          python3 docs/fit-control/handoff/verify_android_apk.py "$apk" fit-control/mobile/www
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.vutovka.fitcontrol'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F 'application-debuggable' "$RUNNER_TEMP/apk-badging.txt"
          "$tools/aapt" dump permissions "$apk"
          sha256sum "$apk"
          stat --format='APK_BYTES=%s' "$apk"
          echo 'APK_VERIFIED_INTERNAL_ONLY; RELEASE_GATE_OPEN; NO_UPLOAD'
